[package]
name = "tauri-plugin-player"
version = "0.1.0"
edition = "2024"
authors = ["Antoine Langlois <dev@antoine-langlois.net>"]
description = "Native video player behind the webview (Media3 ExoPlayer on Android, libmpv on Linux)"
links = "tauri-plugin-player"

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-qt = { path = "../../vendor/tauri-runtime-qt/tauri-runtime-qt" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha", features = ["build"] }
cc = "1"

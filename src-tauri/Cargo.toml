[package]
name = "streamline-player"
version = "0.1.0"
edition = "2024"
authors = ["Antoine Langlois <dev@antoine-langlois.net>"]
description = "Cross-platform player for Streamline"

[lib]
name = "streamline_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
base64 = "0.22.1"
fs4 = "1.1.0"
getrandom = "0.3.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "3.0.0-alpha.6", features = [] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-player = { path = "../plugins/tauri-plugin-player" }
tokio = { version = "1.54.1", features = ["time", "sync", "rt-multi-thread", "net", "io-util", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-qt = { path = "../vendor/tauri-runtime-qt/tauri-runtime-qt" }
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = "3.0.0-alpha.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.12"

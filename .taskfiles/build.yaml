version: "3"

vars:
  ANDROID_SHELL: run inside `nix develop .#android`

tasks:
  engine:
    desc: Build the engine in release (TARGET=<triple> to cross-compile)
    cmd: cargo build --release -p engine {{if .TARGET}}--target {{.TARGET}}{{end}}

  desktop:linux:
    desc: Bundle the desktop app as .deb and .rpm
    platforms: [linux]
    cmd: cargo tauri build --bundles deb,rpm

  desktop:appimage:
    desc: Bundle the desktop app as an AppImage (not on NixOS)
    platforms: [linux]
    preconditions:
      # Tauri's linuxdeploy plugins are scripts starting `#! /bin/bash`, and an
      # AppImage only runs where glibc is at least the build host's; NixOS has
      # no /bin/bash and its glibc is newer than other distributions'.
      - sh: test ! -e /etc/NIXOS
        msg: NixOS cannot build a usable AppImage; build it on another Linux distribution
    cmd: cargo tauri build --bundles appimage

  desktop:windows:
    desc: Build the Windows desktop app (bundled on Windows, cross-built without a bundle on Linux)
    platforms: [windows, linux]
    cmds:
      - cmd: cargo tauri build
        platforms: [windows]
      - cmd: cargo tauri build --target x86_64-pc-windows-gnu --no-bundle
        platforms: [linux]

  desktop:macos:
    desc: Bundle the macOS desktop app
    platforms: [darwin]
    cmd: cargo tauri build

  web:
    desc: Build the static UI into build/ and check its CSP
    cmds:
      - pnpm build
      - node dev/web-build-check.ts
      # Marks build/ as the web target for `task check`; a native build empties build/ and so drops it.
      - touch build/.web-target

  tv-package:
    internal: true
    env:
      TV_PACKAGE: "1"
    cmds:
      - pnpm build
      - node dev/tv-package-paths.ts
      - node dev/web-build-check.ts
      - ffmpeg -loglevel error -y -i static/streamline-mark.png -vf scale=80:80:flags=lanczos build/icon.png
      - ffmpeg -loglevel error -y -i static/streamline-mark.png -vf scale=130:130:flags=lanczos build/largeIcon.png

  webos:
    desc: Package the web build for LG webOS TVs as target/webos/*.ipk
    cmds:
      - task: tv-package
      - >-
        node -e 'require("fs").writeFileSync("build/appinfo.json", JSON.stringify({
        id: "com.datahearth.streamline-player", title: "Streamline Player", vendor: "Streamline",
        type: "web", main: "index.html", icon: "icon.png", largeIcon: "largeIcon.png",
        version: require("./package.json").version, resolution: "1920x1080",
        disableBackHistoryAPI: true, requiredACG: [] }, null, 2))'
      - pnpm exec ares-package build -o target/webos
      - ffmpeg -loglevel error -y -i static/streamline-mark.png -vf scale=400:400:flags=lanczos target/webos/store-icon-400.png

  tizen:
    desc: Package and sign the web build for Samsung Tizen TVs as target/tizen/*.wgt
    preconditions:
      - sh: command -v tizen
        msg: >-
          Needs Tizen Studio's CLI on PATH and a Samsung TV certificate profile made in its
          Certificate Manager (TIZEN_PROFILE, default "streamline")
    cmds:
      - task: tv-package
      - >-
        sed "s/@VERSION@/$(node -p 'require("./package.json").version')/" packaging/tizen/config.xml
        > build/config.xml
      - tizen package -t wgt -s {{.TIZEN_PROFILE | default "streamline"}} -o target/tizen -- build

  android:
    desc: Build the Android APK and AAB (phones and Android TV)
    platforms: [linux, darwin]
    preconditions:
      - sh: test -n "$ANDROID_HOME"
        msg: "{{.ANDROID_SHELL}}"
    cmd: cargo tauri android build --apk --aab

  ios:
    desc: Build the iOS app
    platforms: [darwin]
    cmd: cargo tauri ios build

  image:engine:
    desc: Build the engine's image as streamline-player/engine:local
    cmd: docker build -f deploy/engine.Dockerfile -t streamline-player/engine:local .

  image:web:
    desc: Build the web player's image as streamline-player/web:local
    cmd: docker build -f deploy/web.Dockerfile -t streamline-player/web:local .

  images:
    desc: Build the engine's and the web player's images
    # In sequence, not as deps: parallel builds interleave their output.
    cmds:
      - task: image:engine
      - task: image:web

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The flake's checks are everything `task check` runs (formatting, clippy,
  # biome, svelte-check, the tests) plus the package builds, the engine image,
  # the NixOS VM test and the home-manager evaluation.
  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # `nix copy --no-check-sigs` below needs the runner to be trusted.
          extra_nix_config: trusted-users = root runner

      - name: Remote builder
        uses: ./.github/actions/nix-builder
        with:
          ssh-key: ${{ secrets.NIX_BUILDER_SSH_KEY }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}

      # Everything `nix flake check` evaluates, without building any of it.
      - name: Evaluate the flake
        run: nix flake check --no-build

      # The builder's `ci` account is not a trusted user: it can have the
      # daemon build what it sends (`--store`), not act as a remote builder.
      # The two packages are copied back so the VM test does not build them again.
      - name: Every check but the VM test
        run: |
          set -euo pipefail
          mapfile -t checks < <(nix eval --raw .#checks.x86_64-linux --apply \
            'c: builtins.concatStringsSep "\n" (map (n: ".#checks.x86_64-linux.${n}") (builtins.filter (n: n != "nixos") (builtins.attrNames c)))')
          if [ -n "${NIX_BUILDER_STORE:-}" ]; then
            nix build --no-link --print-build-logs --store "$NIX_BUILDER_STORE" --eval-store auto "${checks[@]}"
            nix copy --no-check-sigs --from "$NIX_BUILDER_STORE" .#engine .#streamline-player
          else
            nix build --no-link --print-build-logs "${checks[@]}"
          fi

      # Needs KVM, which the builder does not have.
      - name: NixOS VM test
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.nixos

      - name: Summary
        if: always()
        run: |
          echo "### Nix" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Formatting, lints, tests, packages, the engine image, the NixOS VM test and the home-manager module" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ nix checks failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint and render the engine chart
        run: |
          set -euo pipefail
          chart=deploy/helm/streamline-engine
          helm lint "$chart" -f "$chart/ci/test-values.yaml"
          helm template engine "$chart" -f "$chart/ci/test-values.yaml" > /dev/null
          # The chart must refuse to render without a tag and a secret.
          if helm template engine "$chart" > /dev/null 2>&1; then
            echo "::error::the chart rendered without image.tag and secret.existingSecret"
            exit 1
          fi

  # The one check branch protection should require.
  ci-ok:
    if: always()
    needs: [nix, helm]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a CI job ended $r"; exit 1; }
          done

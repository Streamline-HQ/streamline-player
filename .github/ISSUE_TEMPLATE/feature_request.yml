name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Every screen follows a design made ahead of the code, so a UI change is a design question first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?

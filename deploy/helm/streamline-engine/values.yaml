image:
  repository: ghcr.io/streamline-hq/streamline-player/engine
  tag: "" # required
  pullPolicy: IfNotPresent

# The key Streamline signs its calls and the playback tokens with, at least 16
# bytes. It is read from a Secret you create, never from these values:
#   kubectl create secret generic streamline-engine --from-literal=secret="$(openssl rand -hex 32)"
secret:
  existingSecret: "" # required
  key: secret

# Extra keys for the engine's config.yaml: hw_accel, hw_device, max_transcodes,
# tonemap, path_map, job_output_ttl… The chart sets listen, secret_file, tmp_dir
# and jobs_dir itself. The file is mounted read-only, so the engine reports its
# settings as read-only and Server settings shows them locked.
config: {}
#  hw_accel: vaapi
#  path_map:
#    - { from: /data/media, to: /srv }

# The libraries, mounted read-only. The paths Streamline sends must resolve
# here, directly or through `config.path_map`.
media: []
#  - name: media
#    existingClaim: media
#    mountPath: /srv

# Live HLS segments, written while a stream plays and dropped when it ends.
# Always an emptyDir.
live:
  sizeLimit: "" # e.g. 20Gi

# Job output. Trickplay sheets and subtitles stay until their source file
# changes or goes; analysis results and prepared downloads expire unread after
# `config.job_output_ttl`, and downloads are most of the size. The background
# backlog waits here too. An emptyDir loses it all with the pod: the backlog is
# gone, and each file's trickplay sheets and subtitles are made again the next
# time it plays.
jobs:
  # A claim you made. The Deployment's Recreate strategy suits a ReadWriteOnce
  # claim.
  existingClaim: ""
  # Without existingClaim, the chart creates a ReadWriteOnce claim this size.
  size: "" # e.g. 50Gi
  storageClass: "" # the cluster default when empty
  # With neither, an emptyDir of at most this size.
  sizeLimit: ""

service:
  type: ClusterIP
  port: 8097

# The players fetch from the engine directly, so it needs an address they can
# reach. Only the data routes are published; /v1, the control plane, stays
# inside the cluster for Streamline.
gateway:
  enabled: false
  parentRefs: [] # [{ name: my-gateway, namespace: gateway-system }]
  hostnames: []

# Where the engine sends its traces and metrics, over OTLP gRPC. Nothing is sent when empty.
otel:
  endpoint: "" # e.g. http://alloy.monitoring.svc.cluster.local:4317

# The GPU goes here, under whatever name the device plugin gives it, e.g.
#   limits: { devic.es/dri: 1 }
resources: {}

podSecurityContext:
  runAsNonRoot: true
  # The image's gid, so the engine can write to a fresh claim. OnRootMismatch
  # spares a full chown of every kept sheet on each start.
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
  # The render node is usually root:render 0660: add the node's `render` gid.
  supplementalGroups: []

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
podAnnotations: {}
